name: Deploy Source.js to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "Source.js"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy to Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_WORKER_NAMES: ${{ secrets.CF_WORKER_NAMES }}
        run: node .github/scripts/deploy-worker.mjs
